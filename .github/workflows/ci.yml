name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: sh -n install-examples.sh

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check js/index.js examples/js-optin/plugin.mjs
      - run: cmp js/index.js examples/js-optin/sdk.js

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall python examples/python-optin
      - run: cmp python/sahaj_crm_plugin_sdk/__init__.py examples/python-optin/sahaj_crm_plugin_sdk/__init__.py
