name: Example plugins

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            platform: darwin_arm64
            uname_arch: arm64
            goos: darwin
            goarch: arm64
            bun_target: bun-darwin-arm64
          - os: ubuntu-latest # amd64
            platform: linux_amd64
            uname_arch: x86_64
            goos: linux
            goarch: amd64
            bun_target: bun-linux-x64
    steps:
      - uses: actions/checkout@v4

      # Bun and PyInstaller build for the runner itself, so a runner change
      # would silently mislabel the artifacts.
      - name: Check the runner architecture
        run: test "$(uname -m)" = "${{ matrix.uname_arch }}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Go examples
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          for example in go-simple go-full; do
            mkdir -p "dist/$example"
            go build -trimpath -o "dist/$example/plugin" "./examples/$example"
            cp "examples/$example/plugin.json" "dist/$example/"
            (cd "dist/$example" && zip -q -r "../${example}_${{ matrix.platform }}.zip" .)
          done

      - name: Build JavaScript examples
        run: |
          for example in js-simple js-full; do
            mkdir -p "dist/$example"
            bun build --compile --target=${{ matrix.bun_target }} \
              "examples/$example/plugin.mjs" --outfile "dist/$example/plugin"
            cp "examples/$example/plugin.json" "dist/$example/"
            (cd "dist/$example" && zip -q -r "../${example}_${{ matrix.platform }}.zip" .)
          done

      # PyInstaller cannot cross-compile, so Python runs on its native runner.
      - name: Build Python examples
        run: |
          python -m pip install --quiet --upgrade pyinstaller
          for example in python-simple python-full; do
            mkdir -p "dist/$example" "$RUNNER_TEMP/$example"
            python -m PyInstaller --onefile --clean --noconfirm \
              --name plugin \
              --distpath "dist/$example" \
              --workpath "$RUNNER_TEMP/$example" \
              --specpath "$RUNNER_TEMP/$example" \
              --paths "$PWD/python" \
              "examples/$example/plugin.py"
            cp "examples/$example/plugin.json" "dist/$example/"
            (cd "dist/$example" && zip -q -r "../${example}_${{ matrix.platform }}.zip" .)
          done

      - uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  # Tag pushes publish a versioned release. Pushes to main refresh a rolling
  # pre-release, so the install URL below always serves the newest builds.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: examples-*
          merge-multiple: true
          path: dist

      - name: Publish example zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="examples-latest"
          fi

          {
            echo "Installable example plugins for the Sahaj CRM."
            echo
            echo "Paste one URL per line into the plugin installer in CRM settings:"
            echo
            for asset in dist/*.zip; do
              echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$asset")"
            done
          } > notes.md

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          elif [ "$tag" = "examples-latest" ]; then
            gh release create "$tag" dist/*.zip \
              --prerelease \
              --title "Example builds" \
              --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/*.zip \
              --title "Example builds $tag" \
              --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY"
          fi
