[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sahaj-crm-plugin-sdk"
version = "0.1.0"
description = "Sahaj CRM plugin SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
include = ["sahaj_crm_plugin_sdk*"]
